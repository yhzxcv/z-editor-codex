<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>代码图鉴 · PvZ2 关卡编辑器</title>
<meta name="description" content="植物大战僵尸 2 关卡编辑器代码图鉴：按主题分类，支持中文名、代码、拼音首字母检索，点击即复制。">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c2024" media="(prefers-color-scheme: dark)">
<!-- 下面两个 ?v=2 是一次性的缓存作废标记，不是常规做法：
     上线初期 _headers 给 /css/* /js/* 配过 max-age=3600，导致老访客浏览器里
     存着旧 app.js / style.css（一小时内不回源），而 index.html 是新的 ——
     表现为新按钮点不动、新样式不出现。改完 _headers 后这种「半个新版本」
     不会再发生，所以以后改这两个文件**不需要**再动版本号。 -->
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<div class="app">
  <!-- 宽屏常驻；窄屏由 ☰ 唤出，同一份 DOM -->
  <aside class="sidebar" id="sidebar" aria-label="章节与目录"></aside>

  <div class="pane">
    <header class="topbar">
      <button class="icon-btn" id="btn-menu" type="button" aria-label="章节与目录">☰</button>
      <div class="brand">代码图鉴</div>
      <div class="search">
        <span class="search-ico" aria-hidden="true">🔍</span>
        <input id="q" type="search" placeholder="搜索名称、代码或拼音首字母"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               aria-label="搜索条目">
        <button class="search-clear" id="q-clear" type="button" aria-label="清空搜索" hidden>✕</button>
      </div>
      <button class="icon-btn" id="btn-filter" type="button" aria-label="搜索范围" aria-haspopup="true">☑</button>
      <button class="icon-btn" id="btn-settings" type="button" aria-label="设置" aria-haspopup="true">⚙</button>
    </header>

    <nav class="chapterbar" id="chapterbar" aria-label="章节"></nav>
    <nav class="groupbar" id="groupbar" aria-label="分组"></nav>

    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>

<div class="scrim" id="scrim" aria-hidden="true"></div>

<div class="popover" id="settings" hidden>
  <div class="pop-title">设置</div>
  <div class="pop-row">
    <span>复制格式</span>
    <div class="seg" data-key="format">
      <button type="button" data-val="plain">纯代码</button>
      <button type="button" data-val="quoted">带引号</button>
    </div>
  </div>
  <div class="pop-row">
    <span>主题</span>
    <div class="seg" data-key="theme">
      <button type="button" data-val="auto">系统</button>
      <button type="button" data-val="light">浅色</button>
      <button type="button" data-val="dark">深色</button>
    </div>
  </div>
  <!-- 四档：标准就是改动前的样子；紧凑/极紧只压字号和内边距，
       单行改成「名称与代码并排」（省最多，代价是极少数长代码走省略号）。 -->
  <div class="pop-row stack">
    <span>条目密度</span>
    <div class="seg" data-key="density">
      <button type="button" data-val="standard">标准</button>
      <button type="button" data-val="compact">紧凑</button>
      <button type="button" data-val="tight">极紧</button>
      <button type="button" data-val="single">单行</button>
    </div>
  </div>
</div>

<div class="popover" id="filter" hidden>
  <div class="pop-title">搜索范围</div>
  <!-- 章节加载完成后由 JS 填充：这里写死就拿不到各章条目数 -->
  <div class="filter-list" id="filter-list"></div>
  <div class="pop-actions">
    <button type="button" data-fa="all">全选</button>
    <button type="button" data-fa="none">清空</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- 数据文件清单：新增章节先跑迁移生成 data/ch-xxx.js，再来这里加一行 -->
<script src="js/chapters.js"></script>
<script src="js/pinyin-table.js"></script>
<script src="js/codex.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>

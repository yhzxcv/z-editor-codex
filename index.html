<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>关卡编辑器 · PvZ2</title>
<meta name="description" content="植物大战僵尸 2 关卡编辑器网页版：对象树 + JSON 文本编辑 + 模块/事件插入 + 图鉴代码插入。">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c2024" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- 两列：侧栏占左边一整列，从顶上一直到底（顶上不留顶栏那道空白）；
     右边 .shell 才是 topbar / 编辑区 / 状态栏那一摞。 -->
<div class="app">

  <aside class="sidebar" id="sidebar" aria-label="对象、模块与图鉴">
    <nav class="tabs">
      <button type="button" data-tab="tree" class="on">对象</button>
      <button type="button" data-tab="modules">模块</button>
      <button type="button" data-tab="codex">图鉴</button>
    </nav>
    <!-- 汇总条和树是两个并列的静态容器：.tabpanel 是全站唯一的滚动容器，
         它俩得共处一个滚动上下文；分成两层是为了让 Tree.render 开头的
         host.textContent = '' 只清树自己，不会把汇总条一起清掉。 -->
    <div class="tabpanel" id="panel-tree">
      <div id="sum" hidden></div>
      <div id="tree-host"></div>
    </div>
    <div class="tabpanel" id="panel-modules" hidden></div>
    <div class="tabpanel" id="panel-codex" hidden></div>
  </aside>

  <div class="shell">
    <!-- 图标按钮的图形由 js/editor/main.js 在 boot 时填（形状表在 js/editor/panels.js
         的 ICONS 里，全站只有那一份）—— 所以这几个 <button> 里是空的。
         它们**不是字符**：原先写的是 ☰ ⚙，在 Android 上会被当 emoji 画成彩色的、
         缺字形时显示豆腐块，同一份代码在不同设备上长得不一样。见 panels.js 那段。 -->
    <header class="topbar">
      <button class="icon-btn" id="btn-menu" type="button" aria-label="侧栏"></button>
      <div class="brand">关卡编辑器</div>
      <div class="doc-name" id="doc-name">未打开文件</div>
      <div class="grow"></div>
      <button class="icon-btn" id="btn-fs-minus" type="button" aria-label="缩小字号"></button>
      <button class="icon-btn" id="btn-fs-plus" type="button" aria-label="放大字号"></button>
      <!-- 一组按钮收在一个盒子里：窄屏换行时**整组一起落到第二行**。
           不收的话 flex 会按"放得下几个放几个"贪心切，把「撤销」单甩到第二行去。 -->
      <div class="tb-actions">
        <button class="btn btn-sm" id="btn-open" type="button">打开</button>
        <button class="btn btn-sm" id="btn-templates" type="button" aria-haspopup="true">模板</button>
        <button class="btn btn-sm" id="btn-undo" type="button" disabled>撤销</button>
        <button class="btn btn-sm" id="btn-redo" type="button" disabled>重做</button>
        <button class="btn btn-sm btn-primary" id="btn-save" type="button">下载</button>
      </div>
      <!-- ⚙ **不在** .tb-actions 里面，是这个盒子的兄弟 —— 在里面的话窄屏换行会被
           整组带到第二行（用户报的：「设置按钮照理是和字号同一行的」）。
           放在盒子**后面**是为了保住它在桌面右上角这个位置：⚙ 那个浮层是
           `position: fixed; right: 8px`（没有像模板那样按按钮定位），按钮一挪远，
           浮层就跟触发器脱开了。窄屏那边用 .tb-actions 的 order 把它换到前面去，
           桌面这一档一个字都不用动。 -->
      <button class="icon-btn" id="btn-settings" type="button" aria-label="设置" aria-haspopup="true"></button>
    </header>

    <main class="main">
      <div class="errbar" id="errbar" hidden></div>
      <div class="editor" id="editor"></div>
    </main>

    <footer class="statusbar" id="statusbar"></footer>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>

<!-- 模板下拉：选项由 js/editor/main.js 从 ZLevel.Templates 填 -->
<div class="popover pop-list" id="tpl-pop" hidden></div>

<div class="popover" id="settings" hidden>
  <div class="pop-title">设置</div>
  <div class="pop-row stack">
    <span>主题</span>
    <div class="seg" data-key="theme">
      <button type="button" data-val="auto">系统</button>
      <button type="button" data-val="light">浅色</button>
      <button type="button" data-val="dark">深色</button>
    </div>
  </div>
  <p class="pop-note">
    未保存的内容只活在当前页面里。浏览器存储随时可能被清掉（Safari 对无互动的站点
    7 天就清一次），<strong>唯一可靠的保存是点「下载」</strong>。
  </p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<input type="file" id="file-input" accept=".json,application/json" hidden>

<!-- 关卡逻辑层：顺序有依赖（rtid 最先，refs 紧跟其后，edit 最后） -->
<script src="js/level/rtid.js"></script>
<script src="js/level/refs.js"></script>
<script src="js/level/order.js"></script>
<script src="js/level/parse.js"></script>
<script src="js/level/spans.js"></script>
<script src="js/level/conflicts.js"></script>
<script src="js/level/edit.js"></script>
<script src="js/level/outline.js"></script>
<script src="js/level/report.js"></script>

<!-- 编辑器数据 -->
<script src="data/modules.js"></script>
<script src="data/module-skeletons.js"></script>
<script src="data/module-docs.js"></script>
<script src="data/templates.js"></script>

<!-- 外部参考文件（tools/gen-refs.mjs 生成，共 7.4 MB）
     它们只往 window.ZLevel.RefData 上挂数据；Refs 在**调用时**才读，
     所以排在这里就够，不必更早 —— 唯一的硬约束是必须在 boot() 之前。 -->
<script src="reference/GridItemTypes.js"></script>
<script src="reference/LevelModules.js"></script>
<script src="reference/PlantTypes.js"></script>
<script src="reference/PropertySheets.js"></script>
<script src="reference/ZombieActions.js"></script>
<script src="reference/ZombieTypes.js"></script>

<!-- 代码图鉴的数据层（图鉴插入面板复用；UI 是编辑器自己的） -->
<script src="js/chapters.js"></script>
<script src="js/pinyin-table.js"></script>
<script src="js/codex.js"></script>
<script src="js/search.js"></script>
<script src="data/ch-plant.js"></script>
<script src="data/ch-zombie.js"></script>
<script src="data/ch-griditem.js"></script>
<script src="data/ch-map.js"></script>
<script src="data/ch-status.js"></script>

<!-- CodeMirror 6，预先打好的 IIFE（见 tools/build-vendor.mjs） -->
<script src="vendor/cm6.js"></script>

<script src="js/editor/jsonpos.js"></script>
<script src="js/editor/state.js"></script>
<script src="js/editor/text.js"></script>
<!-- panels.js 排在 tree.js **前面**：三个使用者在加载期就取 window.ZEditor.Panels
     （tree.js 取 icon/iconBtn，两个面板取 el）。顺序错了不报错也不白屏 ——
     只是名字是 undefined，直到用户点开对应页签才炸。see tools/check-editor.js -->
<script src="js/editor/panels.js"></script>
<script src="js/editor/tree.js"></script>
<!-- 两个面板都排在 panels.js 之后：它们在加载期读 window.ZEditor.Panels.el，
     顺序排错会被 check-editor.js 的早读探测器抓住（el 是 undefined，不报错也不白屏，
     直到用户点开那个页签才炸）。 -->
<script src="js/editor/module-panel.js"></script>
<script src="js/editor/codex-panel.js"></script>
<script src="js/editor/main.js"></script>
</body>
</html>

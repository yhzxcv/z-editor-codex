<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>关卡编辑器 · PvZ2</title>
<meta name="description" content="植物大战僵尸 2 关卡编辑器网页版：对象树 + JSON 文本编辑 + 模块/事件插入 + 图鉴代码插入。">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c2024" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <button class="icon-btn" id="btn-menu" type="button" aria-label="侧栏">☰</button>
    <div class="brand">关卡编辑器</div>
    <div class="doc-name" id="doc-name">未打开文件</div>
    <div class="grow"></div>
    <button class="btn btn-sm" id="btn-open" type="button">打开</button>
    <button class="btn btn-sm" id="btn-templates" type="button" aria-haspopup="true">模板</button>
    <button class="btn btn-sm" id="btn-undo" type="button" hidden>撤销</button>
    <button class="btn btn-sm btn-primary" id="btn-save" type="button">下载</button>
    <button class="icon-btn" id="btn-settings" type="button" aria-label="设置" aria-haspopup="true">⚙</button>
  </header>

  <div class="body">
    <aside class="sidebar" id="sidebar" aria-label="对象与插入">
      <nav class="tabs">
        <button type="button" data-tab="tree" class="on">对象</button>
        <button type="button" data-tab="insert">插入</button>
        <button type="button" data-tab="check">校验</button>
      </nav>
      <div class="tabpanel" id="panel-tree"></div>
      <div class="tabpanel" id="panel-insert" hidden></div>
      <div class="tabpanel" id="panel-check" hidden></div>
    </aside>

    <main class="main">
      <div class="errbar" id="errbar" hidden></div>
      <div class="editor" id="editor"></div>
    </main>
  </div>

  <footer class="statusbar" id="statusbar"></footer>
</div>

<div class="scrim" id="scrim" hidden></div>

<!-- 模板下拉：选项由 js/editor/main.js 从 ZLevel.Templates 填 -->
<div class="popover pop-list" id="tpl-pop" hidden></div>

<div class="popover" id="settings" hidden>
  <div class="pop-title">设置</div>
  <div class="pop-row stack">
    <span>主题</span>
    <div class="seg" data-key="theme">
      <button type="button" data-val="auto">系统</button>
      <button type="button" data-val="light">浅色</button>
      <button type="button" data-val="dark">深色</button>
    </div>
  </div>
  <p class="pop-note">
    未保存的内容只活在当前页面里。浏览器存储随时可能被清掉（Safari 对无互动的站点
    7 天就清一次），<strong>唯一可靠的保存是点「下载」</strong>。
  </p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<input type="file" id="file-input" accept=".json,application/json" hidden>

<!-- 关卡逻辑层：顺序有依赖（rtid 最先，edit 最后） -->
<script src="js/level/rtid.js"></script>
<script src="js/level/order.js"></script>
<script src="js/level/parse.js"></script>
<script src="js/level/conflicts.js"></script>
<script src="js/level/edit.js"></script>
<script src="js/level/outline.js"></script>

<!-- 编辑器数据 -->
<script src="data/modules.js"></script>
<script src="data/module-skeletons.js"></script>
<script src="data/templates.js"></script>

<!-- 代码图鉴的数据层（图鉴插入面板复用；UI 是编辑器自己的） -->
<script src="js/chapters.js"></script>
<script src="js/pinyin-table.js"></script>
<script src="js/codex.js"></script>
<script src="js/search.js"></script>
<script src="data/ch-plant.js"></script>
<script src="data/ch-zombie.js"></script>
<script src="data/ch-griditem.js"></script>
<script src="data/ch-map.js"></script>
<script src="data/ch-status.js"></script>

<!-- CodeMirror 6，预先打好的 IIFE（见 tools/build-vendor.mjs） -->
<script src="vendor/cm6.js"></script>

<script src="js/editor/jsonpos.js"></script>
<script src="js/editor/state.js"></script>
<script src="js/editor/text.js"></script>
<script src="js/editor/tree.js"></script>
<script src="js/editor/panels.js"></script>
<script src="js/editor/main.js"></script>
</body>
</html>
